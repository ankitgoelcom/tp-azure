name: Backup Azure App Service Content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Download via Azure CLI
      env:
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        mkdir -p ./azure-content-backup
        
        # Install Azure CLI
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        
        # Extract credentials from publish profile
        python3 << 'EOF'
        import os
        import xml.etree.ElementTree as ET
        import json
        
        profile_xml = os.environ.get('PUBLISH_PROFILE', '')
        root = ET.fromstring(profile_xml)
        
        # Get the publish profile
        profile = root.find(".//publishProfile")
        if profile:
            app_name = profile.attrib.get('msdeploySite', '')
            print(f"::set-output name=app_name::{app_name}")
        EOF

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add ./azure-content-backup || true
        if ! git diff --cached --quiet; then
          git commit -m "Automated Azure App Service backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No changes detected."
        fi
