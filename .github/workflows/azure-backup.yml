name: Backup Azure App Service Content

on:
  schedule:
    # Runs everyday at midnight (00:00 UTC). Adjust cron expression as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger via GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the current GitHub repository
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    # 2. Download Live Content from Azure using Kudu Zip API
    - name: Download Live Content via REST API
      run: |
        # Extract basic auth credentials from Publish Profile
        PROFILE='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
        KUDU_URL=$(echo "$PROFILE" | grep -o 'publishUrl="https://[^"]*"' | head -n 1 | sed 's/publishUrl="//;s/"//')
        USER=$(echo "$PROFILE" | grep -o 'userName="[^"]*"' | head -n 1 | sed 's/userName="//;s/"//')
        PASS=$(echo "$PROFILE" | grep -o 'userPWD="[^"]*"' | head -n 1 | sed 's/userPWD="//;s/"//')

        # Create target backup folder if it doesn't exist
        mkdir -p ./azure-content-backup

        echo "Connecting to Kudu API to package and download site contents..."
        
        # Download the entire wwwroot directory as a zip file via secure HTTPS
        curl -k -u "$USER:$PASS" -X GET "$KUDU_URL/api/zip/site/wwwroot/" --output site-backup.zip

        echo "Extracting content..."
        # Extract the files, overwriting existing files, and clean up the zip archive
        unzip -o -q site-backup.zip -d ./azure-content-backup
        rm site-backup.zip
        
        echo "Download and extraction complete."

    # 3. Commit and push the downloaded files back to GitHub
    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add ./azure-content-backup
        
        # Only commit if changes exist to avoid empty workflow failures
        if ! git diff --cached --quiet; then
          git commit -m "Automated backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No content changes detected. Skipping backup commit."
        fi
