name: Backup Azure App Service Content

on:
  schedule:
    # Runs automatically every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the current GitHub repository
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    # 2. Extract Credentials using Python and Download Live Content using Kudu Zip API
    - name: Download Live Content via Kudu REST API
      env:
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        # Ensure target directory exists
        mkdir -p ./azure-content-backup

        # Use Python to safely parse the XML profile string and extract credentials
        python3 - << 'EOF'
        import os
        import xml.etree.ElementTree as ET

        profile_xml = os.environ.get('PUBLISH_PROFILE', '')
        if not profile_xml:
            print('ERROR: AZURE_WEBAPP_PUBLISH_PROFILE secret is empty.')
            exit(1)

        root = ET.fromstring(profile_xml)
        
        # Find the MSDeploy publishing method profile block
        msdeploy_profile = root.find(".//publishProfile[@publishMethod='MSDeploy']")

        if msdeploy_profile is None:
            # Fallback to alternative method name if MSDeploy tag isn't explicitly defined
            msdeploy_profile = root.find(".//publishProfile")

        if msdeploy_profile is not None:
            user = msdeploy_profile.attrib.get('userName', '')
            pwd = msdeploy_profile.attrib.get('userPWD', '')
            url = msdeploy_profile.attrib.get('publishUrl', '')
            
            # Strip protocol out and isolate just the domain host string correctly
            host = url.replace('https://', '').replace('http://', '').split(':')[0]
            
            with open('kudu_credentials.env', 'w') as f:
                f.write(f'KUDU_USER={user}\n')
                f.write(f'KUDU_PASS={pwd}\n')
                f.write(f'KUDU_HOST={host}\n')
        else:
            print('ERROR: Could not parse valid publish settings profile structural nodes.')
            exit(1)
        EOF

        # Load the extracted environmental variables safely into the local runner shell
        source kudu_credentials.env
        rm kudu_credentials.env

        # Build full clean target endpoint url path
        KUDU_URL="https://$KUDU_HOST"

        echo "Connecting to Kudu API at: $KUDU_URL/api/zip/site/wwwroot/"
        
        # Download with fail, location, and connect-timeout optimizations to avoid quiet text drops
        curl -k -fL --connect-timeout 300 --max-time 1800 -u "$KUDU_USER:$KUDU_PASS" -X GET "$KUDU_URL/api/zip/site/wwwroot/" --output site-backup.zip || {
          echo "ERROR: Curl download failed. Displaying raw server response content if available:"
          cat site-backup.zip 2>/dev/null || true
          exit 1
        }

        echo "Extracting backup payload archive..."
        # Extract files cleanly inside your local backup deployment storage folder
        unzip -q -o site-backup.zip -d ./azure-content-backup
        rm site-backup.zip
        
        echo "Download and extraction completed successfully."

    # 3. Commit and push the downloaded files back to GitHub
    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add ./azure-content-backup
        
        # Check for modifications to avoid throwing errors on empty commits
        if ! git diff --cached --quiet; then
          git commit -m "Automated Kudu API backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No deployment changes detected on the App Service. Skipping commit."
        fi
