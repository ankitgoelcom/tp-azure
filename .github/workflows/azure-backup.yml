name: Backup Azure App Service Content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Download Live Content via FTP
      env:
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        mkdir -p ./azure-content-backup

        python3 << 'PYTHON_EOF'
        import os
        import xml.etree.ElementTree as ET

        profile_xml = os.environ.get('PUBLISH_PROFILE', '')
        
        if not profile_xml:
            print('ERROR: AZURE_WEBAPP_PUBLISH_PROFILE secret is empty.')
            exit(1)

        try:
            root = ET.fromstring(profile_xml)
            print("DEBUG: XML parsed successfully")
        except ET.ParseError as e:
            print(f"ERROR: Failed to parse XML - {e}")
            exit(1)
        
        # Find FTP profile
        ftp_profile = root.find(".//publishProfile[@publishMethod='FTP']")

        if ftp_profile is not None:
            user = ftp_profile.attrib.get('userName', '')
            pwd = ftp_profile.attrib.get('userPWD', '')
            url = ftp_profile.attrib.get('publishUrl', '')
            
            print(f"DEBUG: Found FTP profile")
            print(f"DEBUG: User: {user}")
            print(f"DEBUG: URL: {url}")
            
            if not user or not pwd or not url:
                print("ERROR: Missing FTP credentials")
                exit(1)
            
            # Append variables to the GitHub Action Environment pipe line
            with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                env_file.write(f"FTP_USER={user}\n")
                env_file.write(f"FTP_PASS={pwd}\n")
                env_file.write(f"FTP_URL={url}\n")
            
            print("DEBUG: Environment variables written")
        else:
            print('ERROR: Could not find FTP profile.')
            exit(1)
        PYTHON_EOF

        if [ -f "$GITHUB_ENV" ]; then
          source "$GITHUB_ENV"
          echo "DEBUG: Environment loaded"
        else
          echo "ERROR: GITHUB_ENV file not found"
          exit 1
        fi

        echo "DEBUG: Starting FTP download..."
        echo "DEBUG: FTP_URL = ${FTP_URL}"
        echo "DEBUG: FTP_USER = ${FTP_USER:0:10}***"
        
        # Create a temporary directory for downloads
        mkdir -p ./ftp-temp
        cd ./ftp-temp
        
        # Use curl to download via FTP with wildcard
        # The URL should be: ftp://user:pass@host/path/*
        FTP_DOWNLOAD_URL="${FTP_URL}*"
        
        echo "Downloading from FTP..."
        curl -fL --user "${FTP_USER}:${FTP_PASS}" \
          "${FTP_DOWNLOAD_URL}" \
          --remote-name --remote-time -R || {
            echo "WARNING: Direct wildcard download failed, trying alternative method..."
        }
        
        # List files to verify
        if [ $(ls -1 2>/dev/null | wc -l) -gt 0 ]; then
          echo "DEBUG: Files downloaded successfully"
          ls -la
        else
          echo "WARNING: No files found, attempting recursive download with wget..."
          cd ..
          
          # Try using wget for recursive download
          wget -r --ftp-user="${FTP_USER}" --ftp-password="${FTP_PASS}" \
            --no-parent --cut-dirs=2 \
            "${FTP_URL}" -P ./azure-content-backup 2>&1 | head -50 || {
            echo "WARNING: wget also failed"
          }
        fi
        
        # Move downloaded files to backup directory
        if [ -d "ftp-temp" ] && [ $(ls -1 ftp-temp 2>/dev/null | wc -l) -gt 0 ]; then
          mv ./ftp-temp/* ./azure-content-backup/ 2>/dev/null || true
          rm -rf ./ftp-temp
        fi
        
        cd ..
        
        # Verify backup directory has content
        if [ $(find ./azure-content-backup -type f | wc -l) -gt 0 ]; then
          echo "✓ Backup completed successfully"
          echo "Files downloaded: $(find ./azure-content-backup -type f | wc -l)"
        else
          echo "✗ No files were downloaded - this may indicate a connection issue"
          echo "Checking FTP connectivity..."
          echo "quit" | curl -v --user "${FTP_USER}:${FTP_PASS}" ftp://${FTP_URL%/*} 2>&1 | head -30 || true
        fi

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add ./azure-content-backup
        if ! git diff --cached --quiet; then
          git commit -m "Automated Azure App Service backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No deployment changes detected on the App Service. Skipping commit."
        fi
