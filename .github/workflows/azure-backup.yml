name: Backup Azure App Service Content

on:
  schedule:
    # Runs automatically every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the current GitHub repository using Node 24 compliant action
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    # 2. Extract Credentials and Download Live Content using Kudu Zip API
    - name: Download Live Content via Kudu REST API
      run: |
        # Ensure target directory exists
        mkdir -p ./azure-content-backup

        # Put publish profile into a temporary file for structured XML parsing
        echo "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" > profile.xml

        # Extract values cleanly using standard XPath expressions targeting MSDeploy/Kudu method
        USER=$(xmllint --xpath 'string(//publishProfile[@publishMethod="MSDeploy"]/@userName)' profile.xml)
        PASS=$(xmllint --xpath 'string(//publishProfile[@publishMethod="MSDeploy"]/@userPWD)' profile.xml)
        RAW_URL=$(xmllint --xpath 'string(//publishProfile[@publishMethod="MSDeploy"]/@publishUrl)' profile.xml)

        # Cleanup the temp credentials file immediately
        rm profile.xml

        # Format URL: strip out any hardcoded port variations and prefix with secure HTTPS
        CLEAN_HOST=$(echo "$RAW_URL" | sed -e 's|https://||' -e 's|:443||')
        KUDU_URL="https://$CLEAN_HOST"

        # Check if URL extraction worked successfully to prevent blind script failure
        if [ -z "$CLEAN_HOST" ]; then
          echo "Error: Failed to extract Kudu host from publish profile XML structure."
          exit 1
        fi

        echo "Connecting to Kudu API at: $KUDU_URL/api/zip/site/wwwroot/"
        
        # Download the entire wwwroot path directory as a zipped payload package 
        curl -k -u "$USER:$PASS" -X GET "$KUDU_URL/api/zip/site/wwwroot/" --output site-backup.zip

        echo "Extracting backup payload archive..."
        # Extract files cleanly directly over your repository target directory
        unzip -q -o site-backup.zip -d ./azure-content-backup
        rm site-backup.zip
        
        echo "Download and extraction completed successfully."

    # 3. Commit and push the downloaded files back to GitHub
    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add ./azure-content-backup
        
        # Check for modifications to avoid throwing errors on empty commits
        if ! git diff --cached --quiet; then
          git commit -m "Automated Kudu API backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No deployment changes detected on the App Service. Skipping commit."
        fi
