name: Backup Azure App Service Content

on:
  schedule:
    # Runs everyday at midnight (00:00 UTC). Adjust cron expression as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger via GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the current GitHub repository
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    # 2. Extract FTP credentials from the Azure Publish Profile safely
    - name: Parse Azure Publish Profile
      id: parse_credentials
      run: |
        PROFILE='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
        
        # Extract fields using simple grep/sed patterns
        FTP_URL=$(echo "$PROFILE" | grep -o 'publishUrl="ftp://[^"]*"' | head -n 1 | sed 's/publishUrl="//;s/"//')
        FTP_USER=$(echo "$PROFILE" | grep -o 'userName="[^"]*"' | head -n 1 | sed 's/userName="//;s/"//')
        FTP_PWD=$(echo "$PROFILE" | grep -o 'userPWD="[^"]*"' | head -n 1 | sed 's/userPWD="//;s/"//')
        
        # Clean the host out of the FTP URL
        FTP_HOST=$(echo "$FTP_URL" | sed -e 's|ftp://||' -e 's|/.*||')
        
        echo "::add-mask::$FTP_PWD"
        echo "ftp_host=$FTP_HOST" >> $GITHUB_OUTPUT
        echo "ftp_user=$FTP_USER" >> $GITHUB_OUTPUT
        echo "ftp_pwd=$FTP_PWD" >> $GITHUB_OUTPUT

    # 3. Mirror the remote Azure webapp directory using LFTP
    - name: Download Live Content from Azure
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        mkdir -p ./azure-content-backup
        
        lftp -u "${{ steps.parse_credentials.outputs.ftp_user }}","${{ steps.parse_credentials.outputs.ftp_pwd }}" \
             "ftp://${{ steps.parse_credentials.outputs.ftp_host }}" <<EOF
        set ftp:ssl-allow true
        set ftp:ssl-force true
        set ftp:ssl-protect-data true
        set ssl:verify-certificate no
        set ftp:passive-mode true
        mirror --verbose --delete /site/wwwroot ./azure-content-backup
        quit
        EOF

    # 4. Commit and push the downloaded files back to GitHub
    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add ./azure-content-backup
        
        # Only commit if changes exist to avoid empty workflow failures
        if ! git diff --cached --quiet; then
          git commit -m "Automated backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No content changes detected. Skipping backup commit."
        fi
