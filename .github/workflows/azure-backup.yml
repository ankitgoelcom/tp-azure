name: Backup Azure App Service Content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Download Live Content via FTP
