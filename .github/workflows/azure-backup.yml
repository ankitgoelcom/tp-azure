name: Backup Azure App Service Content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Download Live Content via FTP
      env:
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        mkdir -p ./azure-content-backup

        python3 << 'PYTHON_EOF'
        import os
        import xml.etree.ElementTree as ET

        profile_xml = os.environ.get('PUBLISH_PROFILE', '')
        
        if not profile_xml:
            print('ERROR: AZURE_WEBAPP_PUBLISH_PROFILE secret is empty.')
            exit(1)
        
        print("DEBUG: Profile XML length:", len(profile_xml))

        try:
            root = ET.fromstring(profile_xml)
            print("DEBUG: XML parsed successfully")
        except ET.ParseError as e:
            print(f"ERROR: Failed to parse XML - {e}")
            exit(1)
        
        # Find FTP profile (better for remote file access)
        ftp_profile = root.find(".//publishProfile[@publishMethod='FTP']")

        if ftp_profile is None:
            print("DEBUG: FTP profile not found, trying any publishProfile")
            ftp_profile = root.find(".//publishProfile")

        if ftp_profile is not None:
            user = ftp_profile.attrib.get('userName', '')
            pwd = ftp_profile.attrib.get('userPWD', '')
            url = ftp_profile.attrib.get('publishUrl', '')
            method = ftp_profile.attrib.get('publishMethod', 'UNKNOWN')
            
            print(f"DEBUG: Using {method} profile")
            print("DEBUG: userName extracted:", "YES" if user else "NO (EMPTY)")
            print("DEBUG: userPWD extracted:", "YES" if pwd else "NO (EMPTY)")
            print("DEBUG: publishUrl extracted:", "YES" if url else "NO (EMPTY)")
            
            if not user or not pwd or not url:
                print("ERROR: One or more required attributes are missing!")
                exit(1)
            
            print(f"DEBUG: Raw publishUrl: {url}")
            print(f"DEBUG: Raw userName: {user}")
            
            # Append variables to the GitHub Action Environment pipe line
            with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                env_file.write(f"FTP_USER={user}\n")
                env_file.write(f"FTP_PASS={pwd}\n")
                env_file.write(f"FTP_URL={url}\n")
                env_file.write(f"FTP_METHOD={method}\n")
            
            print("DEBUG: Environment variables written to GITHUB_ENV")
        else:
            print('ERROR: Could not find any publishProfile.')
            exit(1)
        PYTHON_EOF

        if [ -f "$GITHUB_ENV" ]; then
          source "$GITHUB_ENV"
          echo "DEBUG: GITHUB_ENV sourced successfully"
        else
          echo "ERROR: GITHUB_ENV file not found"
          exit 1
        fi

        echo "DEBUG: FTP_URL value: ${FTP_URL}"
        echo "DEBUG: FTP_USER value: ${FTP_USER}"
        echo "DEBUG: FTP_METHOD value: ${FTP_METHOD}"
        
        # Install rclone for better FTP support
        echo "Installing rclone for FTP backup..."
        curl -sSL https://rclone.org/install.sh | sudo bash || {
          echo "WARNING: rclone installation failed, using curl as fallback"
        }
        
        if command -v rclone &> /dev/null; then
          echo "DEBUG: Using rclone for FTP sync..."
          
          # Create rclone config
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << RCLONE_CONF
        [azure_ftp]
        type = ftp
        host = ${FTP_URL%/*}
        user = ${FTP_USER}
        pass = ${FTP_PASS}
        RCLONE_CONF
          
          # Sync files
          rclone sync azure_ftp:/site/wwwroot ./azure-content-backup -v || {
            echo "ERROR: rclone sync failed"
            exit 1
          }
        else
          echo "DEBUG: Using curl for FTP download (recursive)..."
          
          # Use curl to list and download files via FTP
          curl -fL --ftp-ssl --ssl-reqd \
            -u "${FTP_USER}:${FTP_PASS}" \
            "${FTP_URL}" \
            -o site-backup.tar 2>&1 | head -20 || {
            echo "WARNING: Curl direct download failed, trying alternative..."
            
            # Try using lftp with apt install
            echo "Attempting to install and use lftp..."
            sudo apt-get update -qq && sudo apt-get install -y lftp > /dev/null 2>&1
            
            if command -v lftp &> /dev/null; then
              lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_URL%/*}" << LFTP_CMD
              set sftp:auto-confirm yes
              mirror -R /site/wwwroot ./azure-content-backup
              quit
        LFTP_CMD
            else
              echo "ERROR: Could not install lftp and curl FTP failed"
              exit 1
            fi
          }
        fi

        echo "DEBUG: Download process completed"
        
        # If we got a tar file, extract it
        if [ -f site-backup.tar ]; then
          echo "Extracting tar archive..."
          tar -xf site-backup.tar -C ./azure-content-backup || echo "Note: tar extraction had issues but continuing..."
          rm -f site-backup.tar
        fi

    - name: Commit and Push to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add ./azure-content-backup
        if ! git diff --cached --quiet; then
          git commit -m "Automated Azure App Service backup: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        else
          echo "No deployment changes detected on the App Service. Skipping commit."
        fi
